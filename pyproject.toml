[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mymcps"
version = "0.1.0"
description = "MCP servers for image generation, video watching and audio understanding"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3,<3",
    # Pinned exactly: 1.82.7 / 1.82.8 were compromised on PyPI (2026-03-24).
    "litellm==1.104.0",
    "httpx>=0.27",
    "pydantic>=2.5",
    "pillow>=10",
    "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
image = []
video = ["imageio-ffmpeg>=0.5"]
audio = ["imageio-ffmpeg>=0.5"]
all = ["imageio-ffmpeg>=0.5"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
    "pip-tools>=7",
]

[project.scripts]
image-gen = "mymcps.image_gen.server:main"
video-watch = "mymcps.video_watch.server:main"
audio-listen = "mymcps.audio_listen.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mymcps"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["ffmpeg: tests that run the bundled ffmpeg binary"]
